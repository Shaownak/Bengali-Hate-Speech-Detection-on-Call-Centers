[project]
name = "galecore"
version = "0.1.0"
description = "GAL-E shared core: schemas, config, bus, audio and Bangla text utils, logging, model interfaces"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "redis>=5.2",
    "numpy>=2.1",
    "soxr>=0.5",
    "soundfile>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galecore"]
