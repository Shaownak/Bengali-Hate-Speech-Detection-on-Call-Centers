# strong criticism without insults, threats or gali (docs/08 §3 rule 2) → no event
customer_complaint:
  - আপনাদের সার্ভিস একদম বাজে, তিন দিন ধরে নেট নাই!
  - প্রতিবার ফোন দিলে একই কথা বলেন, কোনো সমাধান হয় না।
  - আমি আর আপনাদের সিম ব্যবহার করব না, অন্য অপারেটরে চলে যাব।
  - এক সপ্তাহ হয়ে গেল, এখনো কোনো খবর নাই, এটা কেমন সার্ভিস?
  - আপনাদের ম্যানেজারের সাথে কথা বলতে চাই, এখনই।
  - টাকা ফেরত না দিলে আমি ভোক্তা অধিকারে অভিযোগ করব।
  - এত খারাপ কাস্টমার সার্ভিস আমি জীবনে দেখি নাই।
  - টাকা কেটে নিলেন অথচ সার্ভিস দিলেন না, এটা তো অন্যায়।
  - আধা ঘণ্টা ধরে লাইনে বসিয়ে রেখেছেন, এটা কোনো কথা হলো?
  - আপনাদের অ্যাপ বারবার ক্র্যাশ করে, ঠিক করেন না কেন?

# a speaker's own mishap / friendly banter / reported speech wrappers ({text} = dataset utterance)
customer_self_directed:
  - ধুর, আমি নিজেই পাসওয়ার্ডটা ভুলে গেছি!
  - ধুর ছাই, আবার ভুল নম্বর টিপে ফেলেছি।
customer_banter:
  - হা হা, আপনি তো আমার চেয়েও বেশি জানেন ভাই!
  - ভাই, তুমি একটু দেখো না প্লিজ, তুমি তো আমাদের লোক।
