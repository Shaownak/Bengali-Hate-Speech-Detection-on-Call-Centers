# Synthetic Bangla call-centre lines for the open-data SFT windows (docs/08 §4, docs/03 §7.2).
# Hand-written, no real call data, no slurs: the abusive utterances in training windows come from
# the open datasets (loaded from .gale/, never committed). Placeholders follow galecore.redact.
version: 1

agent_neutral:
