# Open-dataset register (docs/09 §1–3). Source of truth for ml/data/DATASETS.md
# (regenerate: python -m ml.data.open register --write-md).
#
# commercial_ok: true | false | unknown (default unknown). Runs tagged `prod` refuse anything not
# true; `research` runs may use everything but are tagged research_only and blocked from promotion.
# download_allowed: true only where the files are public without login or click-through terms;
# everything else is placed by hand under $GALE_DATA_DIR/data/raw/<key>/ (see `files`).
# sha256: filled on first verified download/placement (python -m ml.data.open verify).
# columns: how the loader finds fields in the raw files. Entries marked `format: VERIFY` are taken
# from the paper / README and must be checked when the files are first placed.
version: 1
datasets:
  # ---------------------------------------------------------------- text (Bangla script)
  - id: T1
    key: banglamultihate
    name: BanglaMultiHate / BLP-2025 Task 1 (subtask 1C)
    version: blp25_task1@main (subtask_1C)
    url: https://github.com/AridHasan/blp25_task1
    licence: CC BY-NC-SA 4.0 (legal code shipped in the repo)
    commercial_ok: false
    download_allowed: true
    kind: text
    files:
      train: 1C_train.tsv
      dev: 1C_dev.tsv
      test: 1C_test_with_labels.tsv
    download:
      train: https://raw.githubusercontent.com/AridHasan/blp25_task1/HEAD/data/subtask_1C/blp25_hatespeech_subtask_1C_train.tsv
      dev: https://raw.githubusercontent.com/AridHasan/blp25_task1/HEAD/data/subtask_1C/blp25_hatespeech_subtask_1C_dev.tsv
      test: https://raw.githubusercontent.com/AridHasan/blp25_task1/HEAD/data/subtask_1C/blp25_hatespeech_subtask_1C_test_with_labels.tsv
    columns: {id: id, text: text, hate_type: hate_type, hate_severity: hate_severity, to_whom: to_whom}
    format: tsv-unquoted
  - id: T2
    key: bdshs
    name: BD-SHS (LREC 2022)
    url: https://www.kaggle.com/datasets/naurosromim/bdshs
    licence: MIT (code repo); data licence VERIFY on Kaggle
    commercial_ok: unknown
    download_allowed: false
    kind: text
    files: {train: train.csv, dev: val.csv, test: test.csv}
    columns: {text: [sentence, text, comment], hate: [hate, hs, label], target: [target, targets], type: [type, category, types]}
    format: VERIFY
  - id: T3
    key: banglacat
    name: BanglaCAT (2026)
    doi: 10.17632/8vr3w68c7x
    url: https://data.mendeley.com/datasets/8vr3w68c7x
    licence: VERIFY
    commercial_ok: unknown
    download_allowed: false
    kind: text
    files: {train: "train.*", test: "test.*"}
    columns: {text: [bangla_text, text_bn, bangla, text], context: [context, thread_context, previous], toxic: [toxic, label, is_toxic], types: [toxicity_type, type, types, category], context_case: [context_type, case, context_case]}
    format: VERIFY
