[project]
name = "gale-text-worker"
version = "0.1.0"
description = "GAL-E text-worker"
requires-python = ">=3.12,<3.13"
dependencies = ["galecore"]

[project.optional-dependencies]
# GALE_MODEL_MODE=real (D-12): fine-tuned BanglaBERT-family classifier
real = ["transformers>=4.46", "torch>=2.5"]

[project.scripts]
gale-text-worker = "gale_text_worker.__main__:main"

[tool.uv.sources]
galecore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gale_text_worker"]
