[project]
name = "gale-ingest-gateway"
version = "0.1.0"
description = "GAL-E ingest-gateway"
requires-python = ">=3.12,<3.13"
dependencies = ["galecore"]

[project.scripts]
gale-ingest-gateway = "gale_ingest_gateway.__main__:main"

[tool.uv.sources]
galecore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gale_ingest_gateway"]
