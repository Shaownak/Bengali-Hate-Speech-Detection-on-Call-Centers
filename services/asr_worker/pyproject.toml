[project]
name = "gale-asr-worker"
version = "0.1.0"
description = "GAL-E asr-worker"
requires-python = ">=3.12,<3.13"
dependencies = ["galecore"]

[project.optional-dependencies]
# GALE_MODEL_MODE=real on a GPU host (D-12); not in the default environment
real = ["faster-whisper>=1.1", "silero-vad>=5.1", "onnxruntime>=1.20"]

[project.scripts]
gale-asr-worker = "gale_asr_worker.__main__:main"

[tool.uv.sources]
galecore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gale_asr_worker"]
