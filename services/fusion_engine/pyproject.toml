[project]
name = "gale-fusion-engine"
version = "0.1.0"
description = "GAL-E fusion-engine"
requires-python = ">=3.12,<3.13"
dependencies = ["galecore"]

[project.scripts]
gale-fusion-engine = "gale_fusion_engine.__main__:main"

[tool.uv.sources]
galecore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gale_fusion_engine"]
