[project]
name = "gale-llm-judge"
version = "0.1.0"
description = "GAL-E llm-judge"
requires-python = ">=3.12,<3.13"
dependencies = ["galecore"]

[project.scripts]
gale-llm-judge = "gale_llm_judge.__main__:main"

[tool.uv.sources]
galecore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gale_llm_judge"]
