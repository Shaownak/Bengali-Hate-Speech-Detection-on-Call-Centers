[project]
name = "gale-api"
version = "0.1.0"
description = "GAL-E api"
requires-python = ">=3.12,<3.13"
dependencies = ["galecore"]

[project.scripts]
gale-api = "gale_api.__main__:main"

[tool.uv.sources]
galecore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gale_api"]
