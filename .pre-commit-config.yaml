# Local/system hooks only: nothing is downloaded into a pre-commit cache (ADR-009).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pii-in-logs
        name: PII-in-logs lint
        entry: uv run python -m tools.lint_pii_logs
        language: system
        types: [python]
        pass_filenames: false
      - id: no-real-lexicon
        name: block real lexicon / secrets files
        entry: "real lexicon or secret file must not be committed (CLAUDE.md hard rule 2)"
        language: fail
        files: '(\.real\.|\.enc$|^\.env$|\.env\.(?!example))'
