# Shape of the Secrets the chart expects (placeholders only; never put real values here).
# Copy to secrets.yaml (git-ignored), fill in, then encrypt with SOPS (README.md).
apiVersion: v1
kind: Secret
metadata: { name: gale-bus, namespace: gale-app }
type: Opaque
stringData:
  GALE_BUS_URL: redis://:CHANGE_ME@gale-bus.gale-data.svc.cluster.local:6379/0
  REDIS_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata: { name: gale-db, namespace: gale-app }
type: Opaque
stringData:
  GALE_DB_URL: postgresql://gale:CHANGE_ME@gale-pg-rw.gale-data.svc.cluster.local:5432/gale
---
apiVersion: v1
kind: Secret
metadata: { name: gale-pg-owner, namespace: gale-data }
type: kubernetes.io/basic-auth
stringData: { username: gale, password: CHANGE_ME }
---
apiVersion: v1
kind: Secret
metadata: { name: gale-signing, namespace: gale-app }
type: Opaque
stringData: { GALE_OBJECT_URL_SECRET: CHANGE_ME_32_RANDOM_BYTES }
# … repeat gale-bus in gale-ingest / gale-ml / gale-data, gale-db in gale-ml,
#   gale-objectstore (GALE_S3_ACCESS_KEY / GALE_S3_SECRET_KEY) in gale-ingest / gale-ml / gale-app
