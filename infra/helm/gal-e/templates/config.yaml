{{- /* gale-env ConfigMap + secrets in every namespace that runs GAL-E code */ -}}
{{- $root := . -}}
{{- $bus := printf "%s://%s:%v/0" (ternary "rediss" "redis" .Values.bus.tls) .Values.bus.host .Values.bus.port -}}
{{- range $area := list "ingest" "ml" "app" }}
{{- $ns := include "gale.ns" (list $root $area) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gale-env
  namespace: {{ $ns }}
  labels: {{- include "gale.labels" (list $root "config") | nindent 4 }}
data:
  GALE_ENV: {{ $root.Values.global.env | quote }}
  GALE_MODEL_MODE: {{ $root.Values.global.modelMode | quote }}
  GALE_AUTH_MODE: {{ $root.Values.global.authMode | quote }}
  GALE_LOG_LEVEL: {{ $root.Values.global.logLevel | quote }}
  GALE_BUS_BACKEND: redis
  GALE_OBJECT_STORE: {{ $root.Values.objectStore.mode | quote }}
  GALE_S3_ENDPOINT: {{ $root.Values.objectStore.endpoint | quote }}
  GALE_S3_SECURE: {{ $root.Values.objectStore.secure | quote }}
  GALE_S3_BUCKET: {{ $root.Values.objectStore.bucket | quote }}
  GALE_S3_REGION: {{ $root.Values.objectStore.region | quote }}
  GALE_OBJECT_STORE_DIR: /data/objects
  GALE_MODEL_DIR: {{ $root.Values.models.mountPath | quote }}
  GALE_LLM_BASE_URL: {{ printf "http://gale-vllm.%s.svc.cluster.local:8000/v1" (include "gale.ns" (list $root "ml")) | quote }}
  GALE_LLM_MODEL: {{ $root.Values.vllm.servedModelName | quote }}
  {{- if $root.Values.observability.otelCollector.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://gale-otel-collector.%s.svc.cluster.local:4318" (include "gale.ns" (list $root "obs")) | quote }}
  {{- end }}
  HF_HUB_OFFLINE: "1"              # no model downloads at runtime (CLAUDE.md, docs/05 §7)
  GALE_PILOT_CONFIG: /etc/gale/pilot/pilot.yaml   # ADR-020; ConfigMap gale-pilot
  {{- with $root.Values.pilot.prometheusUrl }}
  GALE_PROMETHEUS_URL: {{ . | quote }}            # weekly pilot report: latency + shadow agreement
  {{- end }}
  {{- range $k, $v := $root.Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
# Pilot policy (shadow mode, canaries, report/sampler settings; ADR-020). Workers and jobs read it
# at start: after changing pilot.config, roll the workers (`kubectl rollout restart`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gale-pilot
  namespace: {{ $ns }}
  labels: {{- include "gale.labels" (list $root "pilot") | nindent 4 }}
data:
  pilot.yaml: |
    {{- toYaml $root.Values.pilot.config | nindent 4 }}
{{- end }}

{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- $items := list
  (dict "name" .Values.secrets.bus "remote" $es.remote.bus "keys" (list "GALE_BUS_URL" "REDIS_PASSWORD") "areas" (list "ingest" "ml" "app" "data"))
  (dict "name" .Values.secrets.db "remote" $es.remote.db "keys" (list "GALE_DB_URL") "areas" (list "ml" "app"))
  (dict "name" .Values.secrets.objectStore "remote" $es.remote.objectStore "keys" (list "GALE_S3_ACCESS_KEY" "GALE_S3_SECRET_KEY") "areas" (list "ingest" "ml" "app"))
  (dict "name" .Values.secrets.signing "remote" $es.remote.signing "keys" (list "GALE_OBJECT_URL_SECRET") "areas" (list "app"))
  (dict "name" .Values.secrets.ingestAri "remote" $es.remote.ingestAri "keys" (list "GALE_INGEST_ARI_PASSWORD") "areas" (list "ingest"))
}}
{{- if .Values.pilot.secret }}
{{- /* all four keys must exist in the store (empty strings for unused channels) */}}
{{- $items = append $items (dict "name" .Values.pilot.secret "remote" $es.remote.pilot "keys" (list "GALE_LS_TOKEN" "GALE_SMTP_USER" "GALE_SMTP_PASSWORD" "GALE_REPORT_WEBHOOK_URL") "areas" (list "app")) }}
{{- end }}
{{- if eq .Values.postgres.mode "cnpg" }}
{{- $items = append $items (dict "name" "gale-pg-owner" "remote" $es.remote.db "keys" (list "username" "password") "areas" (list "data") "type" "kubernetes.io/basic-auth") }}
{{- if .Values.postgres.cnpg.backup.enabled }}
{{- $items = append $items (dict "name" .Values.postgres.cnpg.backup.credentialsSecret "remote" $es.remote.pgBackup "keys" (list "ACCESS_KEY_ID" "ACCESS_SECRET_KEY") "areas" (list "data")) }}
{{- end }}
{{- end }}
{{- range $item := $items }}
{{- range $area := $item.areas }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $item.name }}
  namespace: {{ include "gale.ns" (list $root $area) }}
  labels: {{- include "gale.labels" (list $root "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeRef.kind }}
    name: {{ $es.storeRef.name }}
  target:
    name: {{ $item.name }}
    creationPolicy: Owner
    {{- with $item.type }}
    template: { type: {{ . }} }
    {{- end }}
  data:
    {{- range $key := $item.keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $item.remote }}
        property: {{ $key }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
