# OpenTelemetry collector (docs/05 §4): services export OTLP traces here (trace id = call id).
# Spans carry only `gale.call_id` and stage names; the attributes processor drops anything else
# that could ever carry text (defence in depth for CLAUDE.md hard rule 1).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
  batch: { send_batch_size: 1024, timeout: 5s }
  attributes/scrub:
    actions:
      - { key: http.request.body, action: delete }
      - { key: db.statement, action: delete }
      - { key: text, action: delete }
      - { key: transcript, action: delete }
exporters:
  otlphttp/traces:
    endpoint: ${env:TRACES_ENDPOINT}
  debug: { verbosity: basic }
extensions:
  health_check: { endpoint: 0.0.0.0:13133 }
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlphttp/traces]
