[project]
name = "gal-e"
version = "0.1.0"
description = "GAL-E: Gali & Aggression Listening Engine (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "galecore",
    "gale-ingest-gateway",
    "gale-audio-worker",
    "gale-asr-worker",
    "gale-text-worker",
    "gale-llm-judge",
    "gale-fusion-engine",
    "gale-api",
    "gale-postcall",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "fakeredis>=2.26",
    "httpx>=0.27",
    "pre-commit>=4.0",
]
# scripts/download_models.py (build host only)
download = ["huggingface-hub>=0.26"]
# Docker-free dev stack (ADR-009)
devstack = [
    "fakeredis>=2.26",
    "pgserver>=0.1.4",
]

[tool.uv]
package = false
default-groups = ["dev", "devstack"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
galecore = { workspace = true }
gale-ingest-gateway = { workspace = true }
gale-audio-worker = { workspace = true }
gale-asr-worker = { workspace = true }
gale-text-worker = { workspace = true }
gale-llm-judge = { workspace = true }
gale-fusion-engine = { workspace = true }
gale-api = { workspace = true }
gale-postcall = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", ".gale"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Bangla text in strings/comments is intentional
    "SIM108",  # ternaries hurt readability in codec code
    "UP046", "UP047",  # TypeVar generics kept for mypy/pydantic plugin compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["galecore", "gale_*", "ml", "tools"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"tests/**" = ["S101"]
"tools/**" = ["S603", "S607"]
"tools/fixtures_gen/scenarios.py" = ["E501"]  # transcript data
"packages/gale_postcall/src/gale_postcall/report.py" = ["E501"]  # HTML/CSS template
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ['(^|/)tests/', '^web/', '^.gale/']

[[tool.mypy.overrides]]
module = ["soxr", "soundfile", "fakeredis.*", "pgserver.*", "prometheus_client.*",
          # GALE_MODEL_MODE=real packages, optional extras not installed by default (D-12)
          "torch", "transformers", "lightgbm", "silero_vad", "silero_vad.*", "faster_whisper",
          "nemo.*", "funasr", "huggingface_hub"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["packages", "services", "tests", "tools", "ml"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["packages/galecore/src", "packages/gale_postcall/src", "services"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
