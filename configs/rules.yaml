# Fusion rules (docs/03 §8.2). Interpreted by the fusion engine (P1 v0, P3 full).
# Thresholds here are rule triggers on calibrated scores; alert thresholds live in thresholds.yaml.
version: 1
rules:
  - name: slang_fast_path
    description: KWS or exact lexicon hit raises provisional slang; alerts when the agent said it
    when: {any: [{source: kws, category: slang_profanity, score_gte: 0.9},
                 {source: lexicon, match: exact, severity_gte: 2}]}
    then: {event: slang_profanity, severity_from: lexicon, status: provisional, alert_if_speaker: agent}
  - name: sustained_shout
    description: DSP shouting held for at least 2 s
    when: {source: dsp_shout, score_gte: 0.8, min_duration_s: 2.0}
    then: {event: shouting}
  - name: shout_plus_abuse
    description: shouting together with insult/threat/slang text raises severity
    when: {all: [{event: shouting},
                 {source: text_clf, category_in: [insult, threat, slang_profanity], score_gte: 0.6,
                  within_s: 3.0}]}
    then: {severity_delta: 1}
  - name: llm_dismiss
    description: LLM dismissal within 8 s downgrades a provisional event unless KWS is very sure
    when: {source: llm_window, decision: dismiss, within_s: 8.0}
    then: {status: dismissed_by_llm, unless: {source: kws, score_gte: 0.97}}
  - name: agent_register_drop
    description: agent switches down to তুমি/তুই
    when: {source: register, speaker: agent}
    then: {event: disrespect_register, severity: 2}
  - name: overtalk
    description: "repeated interruptions (docs/02 §3.4, at least 3 in 60 s)"
    when: {source: vad_overtalk, count_gte: 3, window_s: 60}
    then: {event: interruption_overtalk, severity: 1}
